[Capture]
; Arms one complete RGBA capture frame.
; Always renders private black/white targets; writes only the selected completed PNG images.
; Uses real same-frame black/white backing RTs inside ReShade, not external reconstruction.
; Does not use Generic Depth or 4x4 coverage resolve.
OutputDirectory=
FileNaming=
; Select which completed images are written. Internal black/white rendering always runs.
OutputBlack=0
OutputWhite=0
OutputTransparent=1
CaptureKey=F10
CaptureModifiers=Ctrl+Shift
ReloadKey=F9
ReloadModifiers=Ctrl+Shift
; Learn ordered-dither mesh signatures at runtime and match their continuous-alpha color passes.
AutoMatch=1
; Learn fullscreen highlight composites from runtime draw state; no shader hashes or fixed resolution required.
AutoHighlight=1
; Optional isolated lens-only test. Keep off for the complete capture chain.
LensOnly=0
; Isolate the confirmed lens scene-color SRVs during ordinary captures.
LensCapture=1
LensPixelShaderHash=3361469263
LensFirstIndex=6448
LensIndexCount=276
; Skip this water pixel shader from NS capture replay only (game rendering is unchanged).
